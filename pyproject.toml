[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litemigrate"
version = "0.1.0a1"
description = "Safer SQLite migrations through shadow verification"
readme = "README.md"
authors = [
    { name = "Chirag Jangir", email = "184008125+chiragjangiir@users.noreply.github.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
keywords = ["sqlite", "migration", "safety", "shadow-copy", "database", "reflink", "apfs", "ficlone"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
litemigrate = "litemigrate.cli:main"

[project.urls]
Homepage = "https://github.com/chiragjangiir/litemigrate"
Repository = "https://github.com/chiragjangiir/litemigrate.git"
Issues = "https://github.com/chiragjangiir/litemigrate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litemigrate = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
show_error_codes = true
